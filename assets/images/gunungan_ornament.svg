<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" width="100%" height="100%">
  <defs>
    <linearGradient id="gununganGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4cd"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#604406"/>
    </linearGradient>
    <linearGradient id="gununganMaroon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a0e1a"/>
      <stop offset="100%" stop-color="#2a050d"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d4af37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#subtleGlow)">
    <!-- Main Gunungan Silhouette / Daun Kayon -->
    <path d="M 100 8
             C 114 36, 172 80, 182 135
             C 188 178, 165 204, 135 210
             C 120 212, 80 212, 65 210
             C 35 204, 12 178, 18 135
             C 28 80, 86 36, 100 8 Z"
          fill="url(#gununganMaroon)" stroke="url(#gununganGold)" stroke-width="2.5"/>

    <!-- Outer Decorative Dots / Praba Border -->
    <path d="M 100 20
             C 112 44, 160 84, 168 132
             C 173 168, 153 192, 128 196
             C 115 198, 85 198, 72 196
             C 47 192, 27 168, 32 132
             C 40 84, 88 44, 100 20 Z"
          fill="none" stroke="url(#gununganGold)" stroke-width="1.2" stroke-dasharray="3 4"/>

    <!-- Gapura / Gerbang Suci (Gate at the base) -->
    <rect x="74" y="148" width="52" height="46" rx="4" fill="#350811" stroke="url(#gununganGold)" stroke-width="1.8"/>
    <!-- Door panels -->
    <line x1="100" y1="148" x2="100" y2="194" stroke="url(#gununganGold)" stroke-width="1.5"/>
    <rect x="78" y="154" width="18" height="34" rx="2" fill="none" stroke="url(#gununganGold)" stroke-width="1"/>
    <rect x="104" y="154" width="18" height="34" rx="2" fill="none" stroke="url(#gununganGold)" stroke-width="1"/>
    <!-- Door handles -->
    <circle cx="93" cy="171" r="2" fill="url(#gununganGold)"/>
    <circle cx="107" cy="171" r="2" fill="url(#gununganGold)"/>
    <!-- Roof of Gapura -->
    <path d="M 68 148 L 100 134 L 132 148 Z" fill="url(#gununganMaroon)" stroke="url(#gununganGold)" stroke-width="1.5"/>
    
    <!-- Central Sacred Trunk (Pohon Hayat / Kalpataru) -->
    <line x1="100" y1="28" x2="100" y2="134" stroke="url(#gununganGold)" stroke-width="2.5"/>

    <!-- Tree Branches & Foliage Curves (Sulur-Suluran Jawa) -->
    <path d="M 100 125 C 75 118, 55 130, 48 116 C 58 110, 80 114, 100 120" fill="none" stroke="url(#gununganGold)" stroke-width="1.5"/>
    <path d="M 100 125 C 125 118, 145 130, 152 116 C 142 110, 120 114, 100 120" fill="none" stroke="url(#gununganGold)" stroke-width="1.5"/>
    
    <path d="M 100 98 C 70 88, 52 104, 46 90 C 60 84, 82 90, 100 94" fill="none" stroke="url(#gununganGold)" stroke-width="1.5"/>
    <path d="M 100 98 C 130 88, 148 104, 154 90 C 140 84, 118 90, 100 94" fill="none" stroke="url(#gununganGold)" stroke-width="1.5"/>

    <path d="M 100 72 C 75 62, 60 76, 56 64 C 70 60, 85 64, 100 68" fill="none" stroke="url(#gununganGold)" stroke-width="1.4"/>
    <path d="M 100 72 C 125 62, 140 76, 144 64 C 130 60, 115 64, 100 68" fill="none" stroke="url(#gununganGold)" stroke-width="1.4"/>

    <path d="M 100 48 C 82 40, 72 52, 70 44 C 80 40, 90 44, 100 46" fill="none" stroke="url(#gununganGold)" stroke-width="1.2"/>
    <path d="M 100 48 C 118 40, 128 52, 130 44 C 120 40, 110 44, 100 46" fill="none" stroke="url(#gununganGold)" stroke-width="1.2"/>

    <!-- Traditional Spiral Batik Motifs (Ukel / Lung-lungan) inside -->
    <circle cx="78" cy="108" r="3.5" fill="none" stroke="url(#gununganGold)" stroke-width="1"/>
    <circle cx="122" cy="108" r="3.5" fill="none" stroke="url(#gununganGold)" stroke-width="1"/>
    <circle cx="82" cy="80" r="3" fill="none" stroke="url(#gununganGold)" stroke-width="1"/>
    <circle cx="118" cy="80" r="3" fill="none" stroke="url(#gununganGold)" stroke-width="1"/>

    <!-- Base Handle (Tangkai / Cempurit Wayang) -->
    <path d="M 97 210 L 97 252 C 97 258, 103 258, 103 252 L 103 210 Z" fill="url(#gununganGold)"/>
    <polygon points="94,210 106,210 100,217" fill="url(#gununganGold)"/>
    <circle cx="100" cy="258" r="3" fill="url(#gununganGold)"/>

    <!-- Peak Crown (Makutha / Inten Kencana) -->
    <circle cx="100" cy="10" r="3" fill="url(#gununganGold)"/>
  </g>
</svg>
