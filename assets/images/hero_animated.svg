<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2119"/>
      <stop offset="60%" stop-color="#14362b"/>
      <stop offset="100%" stop-color="#0a1a14"/>
    </linearGradient>
    <radialGradient id="goldLantern" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff2b2" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a2119" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="35%" stop-color="#e6b800"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#6e4f00"/>
    </linearGradient>
    <linearGradient id="gununganGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7a580a" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="blangkonBatikHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2a16"/>
      <stop offset="50%" stop-color="#321b0d"/>
      <stop offset="100%" stop-color="#1e0f06"/>
    </linearGradient>
    <pattern id="batikPatternHero" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="#351d0e"/>
      <path d="M 0 0 L 14 14 M 14 0 L 0 14" stroke="#4c2914" stroke-width="1.2"/>
      <circle cx="7" cy="7" r="1.5" fill="#a87c3e" opacity="0.85"/>
      <circle cx="0" cy="0" r="1" fill="#d9b168" opacity="0.8"/>
      <circle cx="14" cy="14" r="1" fill="#d9b168" opacity="0.8"/>
    </pattern>

    <!-- Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatCouple {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes petalFall1 {
        0% { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translate(-40px, 480px) rotate(360deg); opacity: 0; }
      }
      @keyframes petalFall2 {
        0% { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
        25% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translate(45px, 480px) rotate(-320deg); opacity: 0; }
      }
      @keyframes starPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }
      .anim-couple {
        animation: floatCouple 5.2s ease-in-out infinite;
      }
      .p1 { animation: petalFall1 7s linear infinite; }
      .p2 { animation: petalFall2 8.5s linear infinite 2s; }
      .p3 { animation: petalFall1 6.5s linear infinite 4s; }
      .st { animation: starPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="600" height="450" rx="20" fill="url(#bgNight)"/>
  
  <!-- Warm Lantern Backlight Glow -->
  <circle cx="300" cy="220" r="240" fill="url(#goldLantern)"/>

  <!-- GUNUNGAN WAYANG JAWA (Silhouette in Background Center) -->
  <g id="gunungan-bg" filter="url(#glowEffect)">
    <!-- Gunungan Leaf / Tree of Life Shape -->
    <path d="M 300 35 C 315 75 390 150 400 220 C 410 290 395 340 375 390 L 225 390 C 205 340 190 290 200 220 C 210 150 285 75 300 35 Z" fill="url(#gununganGold)"/>
    <path d="M 300 35 L 300 390" stroke="url(#goldArch)" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.6"/>
    <!-- Gunungan Sacred Tree / Portal Lines -->
    <path d="M 260 220 Q 300 170 340 220" fill="none" stroke="url(#goldArch)" stroke-width="1.5" opacity="0.4"/>
    <path d="M 240 260 Q 300 190 360 260" fill="none" stroke="url(#goldArch)" stroke-width="1.5" opacity="0.4"/>
    <path d="M 225 310 Q 300 220 375 310" fill="none" stroke="url(#goldArch)" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- GEBYOK & GAPURA ADAT JAWA-SUNDA (Ornate Golden Arch Frame) -->
  <g id="gebyok-arch" stroke="url(#goldArch)" fill="none">
    <!-- Outer Arch -->
    <path d="M 50 450 L 50 180 C 50 80 150 35 300 35 C 450 35 550 80 550 180 L 550 450" stroke-width="4"/>
    <!-- Inner Arch Frame -->
    <path d="M 70 450 L 70 190 C 70 100 160 55 300 55 C 440 55 530 100 530 190 L 530 450" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.75"/>
    
    <!-- Arch Top Ornaments (Kala / Mahkota Gapura) -->
    <g fill="url(#goldArch)" stroke-width="1">
      <circle cx="300" cy="35" r="9"/>
      <circle cx="300" cy="20" r="4.5"/>
      <circle cx="270" cy="42" r="6"/>
      <circle cx="330" cy="42" r="6"/>
      <circle cx="240" cy="55" r="5"/>
      <circle cx="360" cy="55" r="5"/>
    </g>

    <!-- Hanging Ronce Melati Garland on Left & Right Pillars -->
    <g id="hanging-melati-left">
      <circle cx="70" cy="90" r="5" fill="#ffffff"/>
      <circle cx="70" cy="110" r="5" fill="#ffffff"/>
      <circle cx="70" cy="130" r="5" fill="#ffffff"/>
      <circle cx="70" cy="150" r="5" fill="#ffffff"/>
      <circle cx="70" cy="170" r="5" fill="#ffffff"/>
      <circle cx="70" cy="190" r="5" fill="#ffffff"/>
      <circle cx="70" cy="210" r="5" fill="#ffffff"/>
      <circle cx="70" cy="230" r="5.5" fill="#e0475b"/> <!-- Red Accent -->
    </g>
    <g id="hanging-melati-right">
      <circle cx="530" cy="90" r="5" fill="#ffffff"/>
      <circle cx="530" cy="110" r="5" fill="#ffffff"/>
      <circle cx="530" cy="130" r="5" fill="#ffffff"/>
      <circle cx="530" cy="150" r="5" fill="#ffffff"/>
      <circle cx="530" cy="170" r="5" fill="#ffffff"/>
      <circle cx="530" cy="190" r="5" fill="#ffffff"/>
      <circle cx="530" cy="210" r="5" fill="#ffffff"/>
      <circle cx="530" cy="230" r="5.5" fill="#e0475b"/>
    </g>
  </g>

  <!-- ANIMATED COUPLE (Ilham & Risa Together) -->
  <g class="anim-couple">
    <!-- GROOM (ILHAM) - LEFT SIDE -->
    <g transform="translate(130, 85) scale(0.72)">
      <!-- Beskap Base -->
      <path d="M 115 310 Q 105 365 95 450 L 305 450 Q 295 365 285 310 Q 245 285 200 285 Q 155 285 115 310 Z" fill="#18131d"/>
      <path d="M 172 260 C 170 280 182 288 200 288 C 218 288 230 280 228 260 Z" fill="#18131d" stroke="url(#goldArch)" stroke-width="3"/>
      <path d="M 200 288 L 200 450" stroke="url(#goldArch)" stroke-width="4" stroke-dasharray="3 5"/>
      <circle cx="200" cy="320" r="4.5" fill="url(#goldArch)"/>
      <circle cx="200" cy="355" r="4.5" fill="url(#goldArch)"/>
      <circle cx="200" cy="390" r="4.5" fill="url(#goldArch)"/>
      
      <!-- Jasmine Brooch -->
      <circle cx="236" cy="320" r="6" fill="#ffffff"/>
      <circle cx="242" cy="328" r="5" fill="#ffffff"/>
      <circle cx="237" cy="338" r="4.5" fill="#ffffff"/>
      <circle cx="236" cy="348" r="4" fill="#e0475b"/>

      <!-- Neck & Face -->
      <path d="M 182 220 L 182 265 C 182 272 218 272 218 265 L 218 220 Z" fill="#fcd8c7"/>
      <path d="M 152 165 C 152 135 168 125 200 125 C 232 125 248 135 248 165 C 248 210 226 238 200 238 C 174 238 152 210 152 165 Z" fill="#fcd8c7"/>
      
      <!-- Ears & Blush -->
      <ellipse cx="149" cy="172" rx="6" ry="10" fill="#fcd8c7"/>
      <ellipse cx="251" cy="172" rx="6" ry="10" fill="#fcd8c7"/>
      <ellipse cx="170" cy="188" rx="8" ry="4" fill="#ff7f7f" opacity="0.28"/>
      <ellipse cx="230" cy="188" rx="8" ry="4" fill="#ff7f7f" opacity="0.28"/>

      <!-- Eyes looking sweetly rightward at bride -->
      <ellipse cx="180" cy="174" rx="7.5" ry="8.5" fill="#201510"/>
      <circle cx="182" cy="171" r="3" fill="#ffffff"/>
      <path d="M 171 168 Q 180 163 189 167" fill="none" stroke="#1f140e" stroke-width="2.5" stroke-linecap="round"/>

      <ellipse cx="224" cy="174" rx="7.5" ry="8.5" fill="#201510"/>
      <circle cx="226" cy="171" r="3" fill="#ffffff"/>
      <path d="M 215 167 Q 224 163 233 168" fill="none" stroke="#1f140e" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Eyebrows & Smile -->
      <path d="M 168 156 Q 179 150 191 154" fill="none" stroke="#241b2b" stroke-width="3" stroke-linecap="round"/>
      <path d="M 213 154 Q 225 150 236 156" fill="none" stroke="#241b2b" stroke-width="3" stroke-linecap="round"/>
      <path d="M 193 204 Q 202 214 211 204" fill="none" stroke="#b04a5a" stroke-width="2.8" stroke-linecap="round"/>

      <!-- Authentic Blangkon Jawa (Adat Jawa) -->
      <!-- Mondholan (Tonjolan Bulat Khas Blangkon di Belakang) -->
      <ellipse cx="250" cy="132" rx="14" ry="16" fill="#241308" stroke="#160b05" stroke-width="1.2"/>
      <path d="M 242 122 C 255 126 260 138 250 146" fill="none" stroke="#6b4423" stroke-width="1.5" opacity="0.7"/>

      <!-- Blangkon Dome Base & Batik Texture -->
      <path d="M 142 148 C 140 85 168 68 200 68 C 232 68 260 85 258 148 C 252 143 234 138 200 140 C 166 138 148 143 142 148 Z" fill="url(#blangkonBatikHero)"/>
      <path d="M 142 148 C 140 85 168 68 200 68 C 232 68 260 85 258 148 C 252 143 234 138 200 140 C 166 138 148 143 142 148 Z" fill="url(#batikPatternHero)" opacity="0.6"/>

      <!-- Side Flaps (Pelipis Blangkon) -->
      <path d="M 142 146 L 140 160 L 147 154 Z" fill="#351d0e"/>
      <path d="M 258 146 L 260 160 L 253 154 Z" fill="#351d0e"/>

      <!-- Fold Creases of Javanese Headcloth -->
      <path d="M 152 125 Q 196 96 248 118" fill="none" stroke="#1d0e06" stroke-width="2.2" opacity="0.85"/>
      <path d="M 162 108 Q 200 82 238 104" fill="none" stroke="#1d0e06" stroke-width="2" opacity="0.85"/>
      <path d="M 174 94 Q 202 76 228 90" fill="none" stroke="#1d0e06" stroke-width="1.8" opacity="0.75"/>

      <!-- Wiron Pleats (Lipatan Kain Batik Bersilang di Dahi Khas Jawa) -->
      <path d="M 142 148 Q 170 142 200 145 Q 230 142 258 148 L 257 154 Q 228 147 200 150 Q 172 147 143 154 Z" fill="#3e2212" stroke="#221107" stroke-width="1"/>
      <path d="M 143 154 C 162 145 182 142 201 146 L 201 152 C 180 148 162 151 143 158 Z" fill="#4a2916" stroke="#5d341b" stroke-width="0.8"/>
      <path d="M 257 154 C 238 145 218 142 199 146 L 199 152 C 220 148 238 151 257 158 Z" fill="#442513" stroke="#5d341b" stroke-width="0.8"/>
      
      <!-- Fine Javanese Wiron Crease Lines -->
      <path d="M 148 149 Q 174 142 200 146" fill="none" stroke="#caa262" stroke-width="1.3" opacity="0.8"/>
      <path d="M 152 144 Q 176 137 200 141" fill="none" stroke="#caa262" stroke-width="1.3" opacity="0.8"/>
      <path d="M 252 149 Q 226 142 200 146" fill="none" stroke="#a67c38" stroke-width="1.3" opacity="0.8"/>
      <path d="M 248 144 Q 224 137 200 141" fill="none" stroke="#a67c38" stroke-width="1.3" opacity="0.8"/>

      <!-- Center Fold Apex -->
      <path d="M 197 144 L 200 150 L 203 144 Z" fill="#7a4623" stroke="#caa262" stroke-width="0.8"/>
    </g>

    <!-- BRIDE (RISA) - RIGHT SIDE -->
    <g transform="translate(235, 95) scale(0.72)">
      <!-- Kebaya Base -->
      <path d="M 125 310 Q 115 360 100 450 L 300 450 Q 285 360 275 310 Q 240 295 200 295 Q 160 295 125 310 Z" fill="#fffdfa"/>
      <path d="M 190 300 L 190 450" stroke="url(#goldArch)" stroke-width="3" stroke-dasharray="2 4"/>
      <path d="M 210 300 L 210 450" stroke="url(#goldArch)" stroke-width="3" stroke-dasharray="2 4"/>

      <!-- Hijab Wrap -->
      <path d="M 130 230 C 110 270 120 330 160 345 C 190 355 210 355 240 345 C 280 330 290 270 270 230 C 260 270 240 315 200 320 C 160 315 140 270 130 230 Z" fill="#f8fafc"/>
      <path d="M 132 180 C 130 110 160 85 200 85 C 240 85 270 110 268 180 C 268 240 245 275 200 275 C 155 275 132 240 132 180 Z" fill="#ffffff"/>

      <!-- Face -->
      <path d="M 158 170 C 158 135 175 125 200 125 C 225 125 242 135 242 170 C 242 208 225 234 200 234 C 175 234 158 208 158 170 Z" fill="#fcd8c7"/>
      <ellipse cx="172" cy="186" rx="9" ry="5" fill="#ff7f7f" opacity="0.32"/>
      <ellipse cx="228" cy="186" rx="9" ry="5" fill="#ff7f7f" opacity="0.32"/>

      <!-- Eyes looking sweetly leftward at groom -->
      <ellipse cx="176" cy="174" rx="8" ry="9" fill="#2c1a14"/>
      <circle cx="174" cy="171" r="3.2" fill="#ffffff"/>
      <path d="M 166 168 Q 176 162 185 167" fill="none" stroke="#1f140e" stroke-width="2.5" stroke-linecap="round"/>

      <ellipse cx="220" cy="174" rx="8" ry="9" fill="#2c1a14"/>
      <circle cx="218" cy="171" r="3.2" fill="#ffffff"/>
      <path d="M 211 167 Q 220 162 230 168" fill="none" stroke="#1f140e" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Eyebrows & Smile -->
      <path d="M 168 157 Q 178 153 187 156" fill="none" stroke="#5a3d31" stroke-width="2" stroke-linecap="round"/>
      <path d="M 211 156 Q 220 153 230 157" fill="none" stroke="#5a3d31" stroke-width="2" stroke-linecap="round"/>
      <path d="M 193 203 Q 200 211 207 203" fill="none" stroke="#d45b6e" stroke-width="2.6" stroke-linecap="round"/>

      <!-- Kembang Goyang -->
      <line x1="170" y1="100" x2="152" y2="60" stroke="url(#goldArch)" stroke-width="2"/>
      <circle cx="152" cy="60" r="4.5" fill="url(#goldArch)"/>
      <line x1="185" y1="92" x2="175" y2="48" stroke="url(#goldArch)" stroke-width="2"/>
      <circle cx="175" cy="48" r="4.5" fill="url(#goldArch)"/>
      <line x1="200" y1="88" x2="200" y2="42" stroke="url(#goldArch)" stroke-width="2"/>
      <circle cx="200" cy="42" r="5.5" fill="url(#goldArch)"/>
      <line x1="215" y1="92" x2="225" y2="48" stroke="url(#goldArch)" stroke-width="2"/>
      <circle cx="225" cy="48" r="4.5" fill="url(#goldArch)"/>
      <line x1="230" y1="100" x2="248" y2="60" stroke="url(#goldArch)" stroke-width="2"/>
      <circle cx="248" cy="60" r="4.5" fill="url(#goldArch)"/>

      <!-- Siger Sunda -->
      <path d="M 152 135 Q 200 115 248 135 Z" fill="url(#goldArch)"/>
      <path d="M 193 124 Q 200 85 200 82 Q 200 85 207 124 Z" fill="url(#goldArch)"/>
      <circle cx="200" cy="82" r="3.5" fill="#ffffff"/>
      <path d="M 183 126 Q 189 93 195 125 Z" fill="url(#goldArch)"/>
      <path d="M 205 125 Q 211 93 217 126 Z" fill="url(#goldArch)"/>
      <path d="M 172 130 Q 177 102 184 127 Z" fill="url(#goldArch)"/>
      <path d="M 216 127 Q 223 102 228 130 Z" fill="url(#goldArch)"/>
      <circle cx="200" cy="115" r="3" fill="#ffffff"/>

      <!-- Ronce Melati Sunda -->
      <path d="M 154 138 C 148 170 144 210 148 260 C 150 285 146 315 144 340" fill="none" stroke="#4a7c59" stroke-width="1.8"/>
      <circle cx="154" cy="142" r="4" fill="#ffffff"/>
      <circle cx="152" cy="155" r="4.2" fill="#ffffff"/>
      <circle cx="150" cy="170" r="4.5" fill="#ffffff"/>
      <circle cx="148" cy="186" r="4.8" fill="#ffffff"/>
      <circle cx="147" cy="204" r="5" fill="#ffffff"/>
      <circle cx="146" cy="222" r="5" fill="#ffffff"/>
      <circle cx="147" cy="242" r="4.8" fill="#ffffff"/>
      <circle cx="148" cy="262" r="4.5" fill="#ffffff"/>
      <circle cx="146" cy="282" r="4.2" fill="#ffffff"/>
      <circle cx="144" cy="302" r="4" fill="#ffffff"/>
      <circle cx="144" cy="320" r="5" fill="#e0475b"/>

      <!-- Bouquet -->
      <circle cx="188" cy="355" r="10" fill="#ffb6c1"/>
      <circle cx="212" cy="355" r="10" fill="#ffb6c1"/>
      <circle cx="200" cy="344" r="12" fill="#ffffff" stroke="#f0e2b6" stroke-width="1.8"/>
      <circle cx="180" cy="342" r="7" fill="#ffffff"/>
      <circle cx="220" cy="342" r="7" fill="#ffffff"/>
    </g>
  </g>

  <!-- Floating Jasmine Flower Petals & Gold Dust in Atmosphere -->
  <g fill="#ffffff" opacity="0.85">
    <circle class="p1" cx="150" cy="50" r="4"/>
    <circle class="p2" cx="420" cy="40" r="5"/>
    <circle class="p3" cx="280" cy="20" r="3.5"/>
    <circle class="p1" cx="480" cy="80" r="4"/>
  </g>
  <g fill="#ffd700">
    <circle class="st" cx="180" cy="110" r="2.5"/>
    <circle class="st" cx="430" cy="120" r="3"/>
    <circle class="st" cx="300" cy="80" r="3"/>
    <circle class="st" cx="120" cy="240" r="2"/>
    <circle class="st" cx="490" cy="250" r="2.5"/>
  </g>
</svg>
