<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Gradients for Siger Crown & Gold Accents -->
    <linearGradient id="goldSiger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="35%" stop-color="#e6b800"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#7a5500"/>
    </linearGradient>
    <linearGradient id="sigerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbe0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0e6"/>
      <stop offset="100%" stop-color="#fcd8c7"/>
    </linearGradient>
    <linearGradient id="hijabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2f5f7"/>
      <stop offset="100%" stop-color="#dde4e9"/>
    </linearGradient>
    <linearGradient id="kebayaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fbf7ee"/>
      <stop offset="100%" stop-color="#edd9b4"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1"/>
      <stop offset="100%" stop-color="#e06377"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="stickerDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <style>
      @keyframes gentleBreathe {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(0.4deg); }
      }
      @keyframes melatiSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(2.5deg); }
      }
      @keyframes sparklePulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .anim-body {
        transform-origin: 200px 380px;
        animation: gentleBreathe 4.5s ease-in-out infinite;
      }
      .anim-melati {
        transform-origin: 155px 160px;
        animation: melatiSway 3s ease-in-out infinite;
      }
      .sparkle {
        animation: sparklePulse 2.5s ease-in-out infinite;
      }
      .s1 { animation-delay: 0.2s; }
      .s2 { animation-delay: 1.1s; }
      .s3 { animation-delay: 1.8s; }
    </style>
  </defs>

  <!-- Outer Aesthetic Halo / Glow -->
  <circle cx="200" cy="230" r="175" fill="none" stroke="url(#goldSiger)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="200" cy="230" r="160" fill="rgba(212, 175, 55, 0.04)"/>

  <!-- Sticker White Outline Background Layer -->
  <g class="anim-body" filter="url(#stickerDrop)">
    <!-- Main Character Group -->
    <g id="risa-character">
      <!-- Body & Kebaya Base -->
      <path d="M 125 310 Q 115 360 100 450 L 300 450 Q 285 360 275 310 Q 240 295 200 295 Q 160 295 125 310 Z" fill="url(#kebayaGrad)"/>
      
      <!-- Kebaya Lace Details / Gold Brocade Borders -->
      <path d="M 190 300 L 190 450" stroke="#d4af37" stroke-width="3" stroke-dasharray="2 4"/>
      <path d="M 210 300 L 210 450" stroke="#d4af37" stroke-width="3" stroke-dasharray="2 4"/>
      
      <!-- Kebaya Collar V-Neck -->
      <path d="M 170 290 L 200 340 L 230 290" fill="none" stroke="#d4af37" stroke-width="2.5"/>

      <!-- Hijab Shoulders & Chest Drape -->
      <path d="M 130 230 C 110 270 120 330 160 345 C 190 355 210 355 240 345 C 280 330 290 270 270 230 C 260 270 240 315 200 320 C 160 315 140 270 130 230 Z" fill="url(#hijabGrad)"/>
      
      <!-- Hijab Head Wrap Layer -->
      <path d="M 132 180 C 130 110 160 85 200 85 C 240 85 270 110 268 180 C 268 240 245 275 200 275 C 155 275 132 240 132 180 Z" fill="url(#hijabGrad)"/>
      <path d="M 148 180 C 145 130 168 108 200 108 C 232 108 255 130 252 180 C 252 230 235 255 200 255 C 165 255 148 230 148 180 Z" fill="#ffffff" opacity="0.5"/>

      <!-- Face Shape -->
      <path d="M 158 170 C 158 135 175 125 200 125 C 225 125 242 135 242 170 C 242 208 225 234 200 234 C 175 234 158 208 158 170 Z" fill="url(#skinGrad)"/>

      <!-- Soft Blush on Cheeks -->
      <ellipse cx="172" cy="186" rx="10" ry="5.5" fill="#ff7f7f" opacity="0.32"/>
      <ellipse cx="228" cy="186" rx="10" ry="5.5" fill="#ff7f7f" opacity="0.32"/>

      <!-- Eyes (Big aesthetic anime/cartoon style) -->
      <!-- Left Eye -->
      <g>
        <ellipse cx="178" cy="174" rx="8" ry="9" fill="#2c1a14"/>
        <circle cx="175.5" cy="170.5" r="3.2" fill="#ffffff"/>
        <circle cx="180.5" cy="177" r="1.6" fill="#ffffff"/>
        <!-- Eyelash -->
        <path d="M 168 168 Q 178 162 187 167" fill="none" stroke="#1f140e" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 185 166 L 190 163" stroke="#1f140e" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <!-- Right Eye -->
      <g>
        <ellipse cx="222" cy="174" rx="8" ry="9" fill="#2c1a14"/>
        <circle cx="219.5" cy="170.5" r="3.2" fill="#ffffff"/>
        <circle cx="224.5" cy="177" r="1.6" fill="#ffffff"/>
        <!-- Eyelash -->
        <path d="M 213 167 Q 222 162 232 168" fill="none" stroke="#1f140e" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 229 166 L 234 163" stroke="#1f140e" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Gentle Eyebrows -->
      <path d="M 169 157 Q 179 153 188 156" fill="none" stroke="#5a3d31" stroke-width="2" stroke-linecap="round"/>
      <path d="M 212 156 Q 221 153 231 157" fill="none" stroke="#5a3d31" stroke-width="2" stroke-linecap="round"/>

      <!-- Nose & Smile -->
      <path d="M 200 181 L 198 188 L 202 188" fill="none" stroke="#e2a591" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 193 203 Q 200 211 207 203" fill="none" stroke="#d45b6e" stroke-width="2.6" stroke-linecap="round"/>
      <!-- Soft Red Lip Glow -->
      <ellipse cx="200" cy="207" rx="5" ry="2.2" fill="#ff4d6d" opacity="0.45"/>

      <!-- Kembang Goyang Sunda (Golden Hairpins behind Siger) -->
      <g stroke="url(#goldSiger)" stroke-width="2" stroke-linecap="round">
        <line x1="170" y1="100" x2="152" y2="60"/>
        <circle cx="152" cy="60" r="4.5" fill="url(#goldSiger)"/>
        
        <line x1="185" y1="92" x2="175" y2="48"/>
        <circle cx="175" cy="48" r="4.5" fill="url(#goldSiger)"/>

        <line x1="200" y1="88" x2="200" y2="42"/>
        <circle cx="200" cy="42" r="5.5" fill="url(#goldSiger)"/>

        <line x1="215" y1="92" x2="225" y2="48"/>
        <circle cx="225" cy="48" r="4.5" fill="url(#goldSiger)"/>

        <line x1="230" y1="100" x2="248" y2="60"/>
        <circle cx="248" cy="60" r="4.5" fill="url(#goldSiger)"/>
      </g>

      <!-- SIGER SUNDA (Royal Crown on Forehead) -->
      <g id="siger-crown" filter="url(#softGlow)">
        <!-- Siger Base Arc -->
        <path d="M 152 135 Q 200 115 248 135 Q 200 125 152 135 Z" fill="url(#goldSiger)"/>
        
        <!-- Siger Peaks (9 Majestic Sundanese Peaks) -->
        <!-- Center Tall Peak -->
        <path d="M 193 124 Q 200 85 200 82 Q 200 85 207 124 Z" fill="url(#goldSiger)" stroke="#997517" stroke-width="0.8"/>
        <circle cx="200" cy="82" r="3.5" fill="#ffffff"/>

        <!-- Middle Inner Peaks -->
        <path d="M 183 126 Q 188 95 189 93 Q 192 105 195 125 Z" fill="url(#goldSiger)" stroke="#997517" stroke-width="0.8"/>
        <circle cx="189" cy="93" r="2.8" fill="#ffffff"/>
        <path d="M 205 125 Q 208 105 211 93 Q 212 95 217 126 Z" fill="url(#goldSiger)" stroke="#997517" stroke-width="0.8"/>
        <circle cx="211" cy="93" r="2.8" fill="#ffffff"/>

        <!-- Middle Outer Peaks -->
        <path d="M 172 130 Q 176 103 177 102 Q 180 112 184 127 Z" fill="url(#goldSiger)" stroke="#997517" stroke-width="0.8"/>
        <circle cx="177" cy="102" r="2.5" fill="#ffffff"/>
        <path d="M 216 127 Q 220 112 223 102 Q 224 103 228 130 Z" fill="url(#goldSiger)" stroke="#997517" stroke-width="0.8"/>
        <circle cx="223" cy="102" r="2.5" fill="#ffffff"/>

        <!-- Outer Wing Peaks -->
        <path d="M 160 134 Q 163 112 165 111 Q 168 120 173 130 Z" fill="url(#goldSiger)" stroke="#997517" stroke-width="0.8"/>
        <circle cx="165" cy="111" r="2" fill="#ffffff"/>
        <path d="M 227 130 Q 232 120 235 111 Q 237 112 240 134 Z" fill="url(#goldSiger)" stroke="#997517" stroke-width="0.8"/>
        <circle cx="235" cy="111" r="2" fill="#ffffff"/>

        <!-- Far End Flairs -->
        <path d="M 152 135 Q 153 120 155 119 Q 157 125 161 134 Z" fill="url(#goldSiger)"/>
        <path d="M 239 134 Q 243 125 245 119 Q 247 120 248 135 Z" fill="url(#goldSiger)"/>

        <!-- Intricate Carvings inside Siger -->
        <circle cx="200" cy="115" r="3" fill="#ffffff" stroke="#997517" stroke-width="1"/>
        <circle cx="185" cy="120" r="2.2" fill="#ffffff"/>
        <circle cx="215" cy="120" r="2.2" fill="#ffffff"/>
      </g>

      <!-- RONCE MELATI (Sundanese & Javanese Jasmine Garland) -->
      <g class="anim-melati" id="ronce-melati">
        <!-- Hanging from Left Side of Crown/Ear down over Shoulder -->
        <path d="M 154 138 C 148 170 144 210 148 260 C 150 285 146 315 144 340" fill="none" stroke="#4a7c59" stroke-width="1.8"/>
        <!-- Melati Blossom Beads (White Jasmine Buds) -->
        <circle cx="154" cy="142" r="4.2" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="152" cy="153" r="4.5" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="150" cy="165" r="4.5" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="148" cy="177" r="4.8" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="147" cy="190" r="5" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="146" cy="204" r="5.2" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="146" cy="218" r="5.2" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="147" cy="233" r="5" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="148" cy="248" r="5" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="149" cy="263" r="4.8" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="148" cy="278" r="4.5" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="146" cy="293" r="4.5" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="145" cy="308" r="4" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <circle cx="144" cy="323" r="3.8" fill="#ffffff" stroke="#d5e2d5" stroke-width="1"/>
        <!-- Pendant / Red Rose Tip at End of Melati -->
        <circle cx="144" cy="336" r="5.5" fill="#e0475b"/>
        <circle cx="144" cy="344" r="3.5" fill="#4a7c59"/>
      </g>

      <!-- Bouquet in Hands (Bunga Melati & Mawar) -->
      <g id="bouquet" transform="translate(0, 10)">
        <!-- Hands / Gloves -->
        <ellipse cx="188" cy="365" rx="10" ry="7" fill="url(#skinGrad)"/>
        <ellipse cx="212" cy="365" rx="10" ry="7" fill="url(#skinGrad)"/>
        
        <!-- Bouquet Leaves -->
        <path d="M 180 345 Q 165 330 175 315 Q 190 330 180 345 Z" fill="#4a7c59"/>
        <path d="M 220 345 Q 235 330 225 315 Q 210 330 220 345 Z" fill="#4a7c59"/>
        <path d="M 200 335 Q 200 310 208 305 Q 215 320 200 335 Z" fill="#588e68"/>

        <!-- White Jasmine & Pastel Pink Roses -->
        <circle cx="188" cy="335" r="11" fill="url(#roseGrad)"/>
        <circle cx="212" cy="335" r="11" fill="url(#roseGrad)"/>
        <circle cx="200" cy="322" r="13" fill="#ffffff" stroke="#f0e2b6" stroke-width="2"/>
        <circle cx="200" cy="322" r="6" fill="#fdf0cd"/>

        <circle cx="178" cy="320" r="8.5" fill="#ffffff"/>
        <circle cx="222" cy="320" r="8.5" fill="#ffffff"/>
        <circle cx="188" cy="312" r="7.5" fill="url(#roseGrad)"/>
        <circle cx="212" cy="312" r="7.5" fill="url(#roseGrad)"/>

        <!-- Ribbon -->
        <path d="M 195 365 L 180 395" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
        <path d="M 205 365 L 220 395" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
        <circle cx="200" cy="366" r="4.5" fill="#d4af37"/>
      </g>
    </g>
  </g>

  <!-- Golden Sparkle Effects -->
  <g fill="#ffd700">
    <path class="sparkle s1" d="M 140 100 Q 140 92 135 92 Q 140 92 140 84 Q 140 92 145 92 Q 140 92 140 100 Z"/>
    <path class="sparkle s2" d="M 260 90 Q 260 82 255 82 Q 260 82 260 74 Q 260 82 265 82 Q 260 92 260 90 Z"/>
    <path class="sparkle s3" d="M 200 35 Q 200 27 195 27 Q 200 27 200 19 Q 200 27 205 27 Q 200 27 200 35 Z"/>
  </g>
</svg>
